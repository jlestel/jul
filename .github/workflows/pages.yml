name: Site

# Publishes site/ to GitHub Pages: the one page, plus the documentation built from docs/*.md.
# Needs Settings > Pages > Source set to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "scripts/build_docs.py"
      - "cli/**"
      - "lib/**"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # --check fails the deploy on a broken link between pages, rather than publishing it.
      - run: pip install -e ".[docs]" && python scripts/build_docs.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
